<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARTISTS | gguggum art centre</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="site-header"></div>

<main class="wrap">
  <a class="back-link" href="artists.html">&larr;</a>

  <section class="detail artist-detail" id="artist-detail">
    <!-- Filled in by js/artists.js + inline script below -->
  </section>
</main>

<div id="site-footer"></div>

<script src="js/artists.js"></script>
<script src="js/render.js"></script>
<script src="js/common.js"></script>
<script src="js/admin.js"></script>
<script>
  ggSite.mount("artists");
  if (window.ggAdmin) ggAdmin.applyOverrides();

  function paintArtistDetail() {
    ggRender.renderArtistDetail("artist-detail");
  }
  paintArtistDetail();
  if (window.ggAdmin) {
    ggAdmin.registerRerender(paintArtistDetail);
    ggAdmin.init();
  }
</script>
</body>
</html>
