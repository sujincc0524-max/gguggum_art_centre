<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARTISTS | gguggum art centre</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="site-header"></div>

<main class="wrap">
  <h1 class="page-title">ARTISTS</h1>

  <button type="button" class="gg-add-btn" data-gg-add="ggArtists" hidden>+ 아티스트 추가</button>

  <section class="artists-layout">
    <div class="artist-list" id="artist-list"></div>
    <div class="artist-lead-photo" id="artist-lead-photo"></div>
  </section>
</main>

<div id="site-footer"></div>

<script src="js/artists.js"></script>
<script src="js/render.js"></script>
<script src="js/common.js"></script>
<script src="js/admin.js"></script>
<script>
  ggSite.mount("artists");
  if (window.ggAdmin) ggAdmin.applyOverrides();

  // The lead photo panel auto-rotates through every artist every 3s, and
  // hovering a name in the list jumps straight to that artist (pausing the
  // rotation until the mouse leaves). Whichever artist is "active" — shown
  // in the lead photo, whether via rotation, hover, or (on phone) a tap —
  // is highlighted at full opacity; every other name sits at 70%.
  // On phone-width screens there's no shared lead photo: tapping a name
  // instead opens that artist's photo directly beneath it, and rotation
  // is paused entirely.
  var ROTATE_INTERVAL_MS = 3000;
  var FEATURED_ARTIST_ID = "bohnchang-koo"; // 구본창 — shown first on load
  var PHONE_QUERY = "(max-width: 480px)";
  var leadPhoto = { timer: null, artists: [], index: 0 };

  function isPhone() {
    return window.matchMedia(PHONE_QUERY).matches;
  }

  function setActiveRow(id) {
    document.querySelectorAll("a.artist-row").forEach(function (row) {
      row.classList.toggle("is-active", row.dataset.artistId === id);
    });
  }

  function renderLeadPhoto(idx) {
    var photoEl = document.getElementById("artist-lead-photo");
    var artists = leadPhoto.artists;
    if (!artists.length) {
      photoEl.innerHTML = "";
      photoEl.removeAttribute("data-gg-item");
      return;
    }
    leadPhoto.index = idx;
    var artist = artists[idx];
    photoEl.setAttribute("data-gg-item", "ggArtists|" + artist.id);
    photoEl.innerHTML =
      '<a href="artist-detail.html?id=' + artist.id + '">' +
      (artist.photo ? '<img src="' + artist.photo + '" alt="' + artist.name + '">' : "") +
      "</a>";
    setActiveRow(artist.id);
    // The edit-pencil badge lives inside this element's innerHTML, which
    // was just replaced — re-scan so admin mode keeps working as the
    // panel rotates between artists.
    if (window.ggAdmin) ggAdmin.init();
  }

  function stopLeadRotation() {
    if (leadPhoto.timer) {
      clearInterval(leadPhoto.timer);
      leadPhoto.timer = null;
    }
  }

  function startLeadRotation() {
    stopLeadRotation();
    if (isPhone()) return; // phone uses per-row tap instead of auto-rotation
    if (leadPhoto.artists.length < 2) return;
    leadPhoto.timer = setInterval(function () {
      renderLeadPhoto((leadPhoto.index + 1) % leadPhoto.artists.length);
    }, ROTATE_INTERVAL_MS);
  }

  function showArtistById(id) {
    var idx = leadPhoto.artists.findIndex(function (a) { return a.id === id; });
    if (idx > -1) renderLeadPhoto(idx);
  }

  function paintLeadPhoto() {
    leadPhoto.artists = (window.ggArtists || []).filter(function (a) { return a.id; });
    // Start on the featured artist (구본창) if present and has a photo;
    // otherwise fall back to whichever artist actually has a photo
    // uploaded yet, so the very first frame isn't an empty box.
    var featuredIdx = leadPhoto.artists.findIndex(function (a) {
      return a.id === FEATURED_ARTIST_ID && a.photo;
    });
    if (featuredIdx === -1) {
      featuredIdx = leadPhoto.artists.findIndex(function (a) { return a.photo; });
    }
    renderLeadPhoto(featuredIdx > -1 ? featuredIdx : 0);
    startLeadRotation();
  }

  // Closes every open per-row phone photo except (optionally) one id, and
  // fills in its image the first time it's opened.
  function setInlinePhoto(openId) {
    document.querySelectorAll(".artist-row-photo").forEach(function (box) {
      var id = box.getAttribute("data-photo-for");
      if (id === openId) {
        if (!box.dataset.filled) {
          var artist = leadPhoto.artists.find(function (a) { return a.id === id; });
          box.innerHTML =
            artist && artist.photo
              ? '<a href="artist-detail.html?id=' + id + '"><img src="' + artist.photo + '" alt="' + artist.name + '"></a>'
              : "";
          box.dataset.filled = "1";
        }
        box.classList.add("is-open");
      } else {
        box.classList.remove("is-open");
      }
    });
  }

  function wireHoverPreview() {
    var list = document.getElementById("artist-list");
    if (!list) return;
    list.querySelectorAll("a.artist-row").forEach(function (row) {
      if (row.dataset.hoverBound) return;
      row.dataset.hoverBound = "1";
      var id = row.dataset.artistId;

      row.addEventListener("mouseenter", function () {
        if (isPhone()) return;
        stopLeadRotation();
        showArtistById(id);
      });
      row.addEventListener("mouseleave", function () {
        if (isPhone()) return;
        startLeadRotation();
      });

      // Phone: tapping a name toggles its photo open/closed right below
      // it, instead of navigating straight to the detail page. Tapping
      // the photo itself (once open) still goes to artist-detail.html.
      row.addEventListener("click", function (e) {
        if (!isPhone()) return;
        e.preventDefault();
        var box = row.parentElement.querySelector('.artist-row-photo[data-photo-for="' + id + '"]');
        var alreadyOpen = box && box.classList.contains("is-open");
        setActiveRow(alreadyOpen ? null : id);
        setInlinePhoto(alreadyOpen ? null : id);
      });
    });
  }

  function paint() {
    ggRender.renderArtistList("artist-list");
    paintLeadPhoto();
    wireHoverPreview();
  }
  paint();

  if (window.ggAdmin) {
    ggAdmin.registerRerender(paint);
    ggAdmin.init();
  }

  // Crossing the phone breakpoint mid-session (resize, device rotate)
  // should switch cleanly between the two modes rather than leaving stale
  // state (a rotation timer running behind a hidden panel, or an open
  // inline photo left over once the shared panel reappears).
  (function () {
    var wasPhone = isPhone();
    window.addEventListener("resize", function () {
      var nowPhone = isPhone();
      if (nowPhone === wasPhone) return;
      wasPhone = nowPhone;
      if (nowPhone) {
        stopLeadRotation();
      } else {
        setInlinePhoto(null);
        startLeadRotation();
      }
    });
  })();

  // The lead photo is a square sized to match the artist-list's full
  // height — i.e. the span from the first artist name to the last one.
  (function () {
    var list = document.getElementById("artist-list");
    var photo = document.getElementById("artist-lead-photo");

    function syncPhotoSize() {
      var h = list.getBoundingClientRect().height;
      if (h > 0) {
        photo.style.width = "min(" + h + "px, 100%)";
      }
    }

    // Run on load/resize, plus a couple of rAF passes so this still lands
    // correctly even if fonts/layout settle a frame or two late.
    syncPhotoSize();
    requestAnimationFrame(function () {
      requestAnimationFrame(syncPhotoSize);
    });
    window.addEventListener("load", syncPhotoSize);
    window.addEventListener("resize", syncPhotoSize);
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(syncPhotoSize);
    }
    if (window.ResizeObserver) {
      new ResizeObserver(syncPhotoSize).observe(list);
    }
  })();
</script>
</body>
</html>
