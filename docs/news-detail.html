<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEWS | gguggum art centre</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="site-header"></div>

<main class="wrap">
  <a class="back-link" href="news.html">&larr;</a>

  <div class="news-banner" id="news-banner"></div>

  <section class="news-detail" id="news-detail">
    <!-- Filled in below -->
  </section>
</main>

<div id="site-footer"></div>

<script src="js/news.js"></script>
<script src="js/render.js"></script>
<script src="js/common.js"></script>
<script src="js/admin.js"></script>
<script>
  ggSite.mount("news");
  if (window.ggAdmin) ggAdmin.applyOverrides();

  function paintNewsDetail() {
    ggRender.renderNewsDetail("news-banner", "news-detail");
  }
  paintNewsDetail();
  if (window.ggAdmin) {
    ggAdmin.registerRerender(paintNewsDetail);
    ggAdmin.init();
  }
</script>
</body>
</html>
