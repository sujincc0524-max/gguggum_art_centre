<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EXHIBITIONS | gguggum art centre</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="site-header"></div>

<main class="wrap">
  <a class="back-link" href="index.html">&larr;</a>

  <section class="detail" id="exhibition-detail">
    <!-- Filled in by js/data.js + inline script below -->
  </section>
</main>

<div id="site-footer"></div>

<script src="js/data.js"></script>
<script src="js/render.js"></script>
<script src="js/common.js"></script>
<script src="js/admin.js"></script>
<script>
  ggSite.mount("exhibitions");
  if (window.ggAdmin) ggAdmin.applyOverrides();

  function paintExhibitionDetail() {
    ggRender.renderExhibitionDetail("exhibition-detail");
  }
  paintExhibitionDetail();
  if (window.ggAdmin) {
    ggAdmin.registerRerender(paintExhibitionDetail);
    ggAdmin.init();
  }
</script>
</body>
</html>
