<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CONTACT | gguggum art centre</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="site-header"></div>

<main class="wrap">

  <section class="contact-top" id="contact-top">
    <div class="contact-info">
      <div class="info-block">
        <h2>ADDRESS</h2>
        <p id="contact-address"></p>
      </div>
      <div class="info-block">
        <h2>TEL</h2>
        <p id="contact-tel"></p>
      </div>
      <div class="info-block">
        <h2>EMAIL</h2>
        <p><a id="contact-email" href="mailto:"></a></p>
      </div>
      <div class="info-block">
        <h2>HOURS</h2>
        <p id="contact-hours"></p>
      </div>
    </div>
    <div class="contact-photo">
      <img id="contact-photo" src="" alt="gguggum art centre building">
    </div>
  </section>

  <section class="contact-intro">
    <p class="intro-kr" id="contact-intro-ko"></p>
    <p class="intro-en" id="contact-intro-en"></p>
  </section>

  <section class="contact-form-section">
    <h2 class="page-title">CONTACT US</h2>
    <form class="contact-form" id="contact-form">
      <input type="text" name="name" placeholder="NAME" required>
      <input type="email" name="email" placeholder="E-MAIL" required>
      <input type="text" name="title" placeholder="TITLE">
      <textarea name="message" placeholder="MESSAGE"></textarea>
      <button type="submit" class="send-btn">SEND</button>
      <p class="contact-form-note" id="contact-form-note" hidden>메일 작성 화면이 열립니다. 그대로 보내기를 눌러주세요.</p>
    </form>
  </section>

</main>

<div id="site-footer"></div>

<script src="js/contact.js"></script>
<script src="js/render.js"></script>
<script src="js/common.js"></script>
<script src="js/admin.js"></script>
<script>
  ggSite.mount("contact");
  if (window.ggAdmin) ggAdmin.applyOverrides();

  function paintContact() {
    ggRender.renderContact({
      root: "contact-top",
      address: "contact-address",
      tel: "contact-tel",
      email: "contact-email",
      hours: "contact-hours",
      photo: "contact-photo",
      introKo: "contact-intro-ko",
      introEn: "contact-intro-en"
    });
  }
  paintContact();
  if (window.ggAdmin) {
    ggAdmin.registerRerender(paintContact);
    ggAdmin.init();
  }

  // Static site with no backend, so "sending" opens the visitor's own mail
  // app with a message pre-addressed to the gallery inbox — they just hit
  // send there. This is the most reliable option without a mail server/API.
  document.getElementById("contact-form").addEventListener("submit", function (e) {
    e.preventDefault();

    var name = this.name.value.trim();
    var email = this.email.value.trim();
    var title = this.title.value.trim();
    var message = this.message.value.trim();

    var subject = title || ("Contact form message from " + name);
    var bodyLines = [
      "Name: " + name,
      "Email: " + email,
      "",
      message
    ];
    var mailto =
      "mailto:" + (window.ggContact ? window.ggContact.email : "kuca2018@naver.com") +
      "?subject=" + encodeURIComponent(subject) +
      "&body=" + encodeURIComponent(bodyLines.join("\n"));

    window.location.href = mailto;

    document.getElementById("contact-form-note").hidden = false;
    this.reset();
  });
</script>
</body>
</html>
